   name: CI

   on:
     pull_request:
       branches: [main]

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 24
             cache: npm
         - run: npm ci
         - run: npx prisma generate
         - run: npm run lint
         - run: npm run build
